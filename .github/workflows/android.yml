name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the tested Flutter revision
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin ab2912035e160d9cad6306df307576da6128ebdb
          git -C "$RUNNER_TEMP/flutter" checkout -b stable FETCH_HEAD
          git -C "$RUNNER_TEMP/flutter" tag 3.50.0
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Validate Flutter
        working-directory: mobile
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter analyze
          flutter test
      - name: Check Android discovery timeout and results
        working-directory: mobile/android
        run: ./gradlew :app:testReleaseUnitTest --no-daemon
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-discovery-test-results
          path: |
            mobile/build/app/reports/tests/testReleaseUnitTest/
            mobile/build/app/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: the-vault-universal-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
