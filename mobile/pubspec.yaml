name: the_vault
description: "Maximum security. Minimum secret. A real-time biometric ritual."
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  camera: ^0.11.2
  camera_android: ^0.10.10
  http: ^1.3.0
  crypto: ^3.0.6
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^9.2.4
  image: ^4.5.4
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
