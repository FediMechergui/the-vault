name: the-vault
services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports: ["8443:8443"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vault:${PG_PASSWORD}@postgres:5432/vault
      REDIS_URL: redis://redis:6379/0
      VISION_ADDRESS: vision-py:50051
      SCORING_URL: http://matlab-engine:9910
      S3_ENDPOINT: http://minio:9000
    volumes: ["./infra/certs:/certs:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      vision-py: {condition: service_started}
    restart: unless-stopped
  vision-py:
    build:
      context: .
      dockerfile: vision-py/Dockerfile
    expose: ["50051"]
    restart: unless-stopped
  matlab-engine:
    build:
      context: .
      dockerfile: matlab-engine/Dockerfile
    environment:
      SCORING_BACKEND: python-reference
    expose: ["9910"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9910/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_DB: vault
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  pgdata:
  miniodata:
networks:
  default:
    name: vault-net
